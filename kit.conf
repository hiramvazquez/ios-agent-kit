# kit.conf — el ÚNICO fichero que el kit necesita del proyecto.
#
# Este proyecto ES el kit. Aquí no hay Swift ni `swift build`: hay bash, markdown y un
# python. Así que "verificado" significa otra cosa que en una app iOS, y conviene decir
# exactamente qué.
#
# Por qué existe: sin este fichero, la puerta de commit del propio kit deja el repo en un
# callejón sin salida — bloquea el commit porque no hay firma, y `verifica.sh` no puede
# crearla porque aborta por falta de `kit.conf`. Arreglar ese deadlock para todos los
# repos ajenos es el cambio `la-puerta-mira-el-repo-del-commit`; para ESTE repo, que sí es
# del kit, la salida correcta no es que la puerta lo ignore: es tener kit.conf.

# Dónde buscaría duplicados `busca-duplicados.py`.
#
# LÍMITE DECLARADO, con su medición: ese detector lee Swift, y aquí no hay ni un fichero
# .swift. Va a reportar siempre "0 ficheros", así que la duplicación en bash de este repo no
# la mira ningún automatismo.
#
# Antes esto decía que «nadie la está buscando», que sonaba a agujero grande. Se buscó, el
# 2026-09-08, sobre todos los scripts del repo. Aquí NO va cuántos eran, y esa ausencia es el
# resultado de intentarlo tres veces: la nota dijo «11 scripts, ~1.400 líneas», luego «14 y
# ~2.000», luego «15 y 2.195», y las tres caducaron antes de cerrar el cambio, porque el
# propio cambio seguía añadiendo scripts. La tercera aguantó nueve minutos. El tamaño se
# cuenta al leer, con `ls scripts/*.sh scripts/*.py | wc -l`; lo que la medición aporta y no
# caduca es el resultado: UN duplicado real
# —la resolución del cambio activo, copiada en tres sitios, que ya se había cobrado un
# defecto y que hoy vive en `lib-kit.sh`—.
#
# Lo que queda repetido entre ficheros distintos NO se enumera aquí, y esa ausencia también
# tiene historia: la nota decía «el idioma de carga de las libs y un encabezado de sección de
# los bancos, los dos deliberados», y el cambio `donde-la-regla-solo-llego-a-un-hermano` la
# dejó falsa EL MISMO DÍA — añadió la guarda de raíz de repositorio y una aserción de banco,
# las dos repetidas y las dos a propósito. Lo cazó el juez de aceptación corriendo el comando
# que esta misma nota publica. Es la cuarta vez que esta nota caduca, así que se deja de
# enumerar: se corre el comando, y lo que salga se juzga leyendo. Repetible:
#
#   for f in scripts/*.sh; do
#       grep -v '^[[:space:]]*#' "$f" | sed 's/^[[:space:]]*//' | awk 'length>45' | sort -u
#   done | sort | uniq -d
#
# Por eso NO se escribe un detector de duplicados para bash: encontraría lo que encuentra ese
# pipeline de tres líneas, y costaría un script, su banco y su mantenimiento para siempre. La
# regla de la casa dice que un detector solo nace cuando su clase ya falló dos veces Y no hay
# forma más barata de verlo; aquí la hay. Vuelve a correrlo cuando el repo crezca.
FUENTES="scripts"

verificaciones() {
    # 1. Que los scripts sean bash válido. Es lo mínimo y es instantáneo: un `.sh` con un
    #    paréntesis de más se instala igual y falla en el turno de alguien, no aquí.
    paso "sintaxis · scripts" bash -c '
        set -e
        for f in scripts/*.sh; do bash -n "$f"; done'

    # 2. shellcheck sobre todos los scripts.
    #
    #    LÍMITE DECLARADO: si shellcheck no está instalado, este paso FALLA en vez de
    #    saltarse. Es deliberado. Un paso que se salta solo cuando falta la herramienta
    #    firma un verde que no ha comprobado nada, y este kit existe en buena parte para
    #    que eso no pase. Si falta: `brew install shellcheck`.
    #
    #    `--severity=warning` deja fuera los `info`, y eso es una decisión, no pereza: de
    #    los que salen hoy, uno es un falso positivo (`paso()` «nunca se invoca» — la
    #    invoca kit.conf) y otro señala algo DELIBERADO (`$FUENTES` sin comillar en
    #    verifica.sh: son varios directorios y comillarlo lo rompería). Un linter que grita
    #    lo que no se va a arreglar deja de leerse.
    #
    #    Aquí hubo un `--exclude=SC2038`, deuda con dueño escrito: `inyecta-contexto.sh`
    #    encadenaba `find` con `xargs` sin `-print0` y se comía las rutas con espacios, que
    #    en DerivedData las hay. El cambio `el-contexto-dice-de-que-repo-habla` reescribió
    #    esa parte, así que la exclusión se ha borrado — que es lo que tenía que pasar.
    paso "shellcheck · scripts" bash -c '
        command -v shellcheck >/dev/null || {
            echo "falta shellcheck — brew install shellcheck"; exit 1; }
        shellcheck --severity=warning scripts/*.sh'

    # 3. Que el python parsee. Mismo argumento que el 1.
    paso "sintaxis · python" bash -c '
        set -e
        for f in scripts/*.py; do python3 -m py_compile "$f"; done'

    # 4. Los manifiestos y las piezas del plugin. Existe porque fallaron DOS veces el mismo
    #    día y no se ven leyendo el fichero: se ven al instalar.
    paso "manifiestos y piezas del plugin" bash scripts/autocomprueba.sh

    # 5. El banco de pruebas de la puerta de commit.
    #
    #    Nació en rojo a propósito, fijando los fallos de la puerta, y hoy está en verde.
    #    El resto de sus casos son de no-regresión: pasaban antes y tienen que seguir
    #    pasando. El recuento no se escribe aquí — lo imprime el banco, contado. La primera
    #    versión de este comentario decía «once casos» y el README decía «diez» el mismo
    #    día.
    paso "puerta de commit" bash scripts/verifica-puerta.sh

    # 6. El banco del hook que inyecta el contexto.
    #
    #    Mismo patrón que el 5. Entre sus casos de no-regresión hay uno que importa más de
    #    lo que parece: que el caché no sirva las dependencias de un proyecto a otro. Ese
    #    aislamiento ya existía porque el caché vivía dentro de cada repo; al sacarlo fuera
    #    había que no romperlo.
    paso "contexto inyectado" bash scripts/verifica-contexto.sh

    # 7. El banco del detector de lógica repetida.
    #
    #    Nació con UN caso en rojo, medido: el symlink contado como dos ficheros, que el
    #    mismo cambio cerró. El otro defecto que se creía tener —un suelo de ruido que colaba
    #    dobles de test— resultó no ser tal: subir el suelo borraba dos duplicados reales, así
    #    que se dejó donde estaba y el ruido se asume. Sus casos pasan igual contra la versión
    #    vieja, y eso es correcto: fijan un comportamiento que no cambió. El recuento de casos
    #    no se escribe aquí, lo cuenta el banco.
    paso "lógica repetida · detector" bash scripts/verifica-duplicados.sh

    # 8. El banco de `rodaja.sh`, y sobre todo de su modo `--entregado`.
    #
    #    Existe porque `--entregado` es la ÚNICA fuente de evidencia del juez de aceptación:
    #    si se equivoca, el veredicto deja de significar nada. Nació sin banco y el revisor
    #    encontró en él dos defectos que estos casos habrían cazado solos —juzgaba el primer
    #    cambio por orden aunque le dijeran cuál, y perdía en silencio lo commiteado antes de
    #    renombrar el directorio del cambio—. Los dos están cerrados y fijados aquí.
    paso "rodaja y lo entregado" bash scripts/verifica-rodaja.sh

    # 9. El banco de `verifica.sh`: sus códigos de salida y su firma.
    #
    #    Llegó el último y no debería: es la pieza que decide si hay firma, y por tanto si la
    #    puerta deja commitear. Este cambio le cambió el contrato de salida y abrió tres
    #    bancos para cerrar ese mismo agujero en otras piezas, dejándolo abierto justo aquí.
    #    Lo señaló el juez de aceptación en su tercera ronda. Un caso sale rojo contra la
    #    versión anterior: el que fija que tres pasos en rojo no se confundan con «no pude
    #    mirar».
    paso "verifica y su firma" bash scripts/verifica-salidas.sh

    # 10. El banco de la propia autocomprobación, que es la puerta de publicación.
    #
    #     NO nace en rojo, y es correcto: no fija un fallo vivo, cubre la última pieza con
    #     lógica que nadie miraba —la que dice «se puede publicar»— y que estuvo diez
    #     versiones dejando pasar una invocación muerta en el prompt del juez. Monta árboles
    #     de kit falsos con un defecto cada uno, y uno sano: ese último es el que impide que
    #     los demás pasen por construcción, porque un detector que dijera que no a todo los
    #     aprobaría todos.
    paso "la autocomprobación" bash scripts/verifica-autocomprueba.sh

    # 11. El banco de `doc-paquetes.sh`.
    #
    #     Era el único script de producción del kit sin banco, y no por azar era también el
    #     único con una rama muerta: su `find` de `.build/checkouts` llevaba un `-depth 1`
    #     insatisfacible en el `find` de BSD (macOS), así que un proyecto SwiftPM puro sin
    #     DerivedData recibía «Sin paquetes resueltos todavía» teniéndolos resueltos.
    #
    #     Desde `el-hermano-que-quedaba` cubre además el acotado, cuyos límites —incluido lo
    #     que NO acota— están declarados en `scripts/lib-kit.sh` y no se repiten aquí. Y desde
    #     que esa resolución vive ahí, este banco y el del hook miden la MISMA función.
    #     Cuáles de sus casos nacen en rojo lo dice el propio banco al correrlo contra una
    #     versión anterior; escribirlo aquí ya caducó una vez.
    paso "documentación de paquetes" bash scripts/verifica-doc-paquetes.sh

    # LO QUE NO SE VERIFICA AQUÍ, dicho para que nadie lea de más en la firma:
    #
    # - Los `commands/`, `agents/` y `skills/` son markdown: nadie comprueba que lo que
    #   dicen siga siendo cierto. Eso lo hace una persona leyendo el diff.
    # - Que el plugin CARGUE de verdad en Claude Code solo se ve instalándolo.
    #   `autocomprueba.sh` cubre los fallos de manifiesto que ya ocurrieron, no todos los
    #   posibles.
}
