# kit.conf — el ÚNICO fichero que el kit necesita del proyecto.
#
# Este proyecto ES el kit. Aquí no hay Swift ni `swift build`: hay bash, markdown y un python,
# así que "verificado" significa otra cosa que en una app iOS y conviene decir exactamente qué.
# Existe además porque sin él la puerta de commit del propio kit bloquearía todo commit y
# `verifica.sh` no podría firmar nada.

# Dónde buscaría duplicados `busca-duplicados.py`.
#
# LÍMITE DECLARADO: ese detector lee Swift, y aquí no hay ni un fichero .swift. La duplicación
# en bash de este repo no la mira ningún automatismo. Se busca a mano, con este pipeline:
#
#   for f in scripts/*.sh; do
#       grep -v '^[[:space:]]*#' "$f" | sed 's/^[[:space:]]*//' | awk 'length>45' | sort -u
#   done | sort | uniq -d
#
# No se escribe un detector para bash: encontraría lo mismo que ese pipeline y costaría un
# script, su banco y su mantenimiento.
FUENTES="scripts"

# Qué NO cubre esta firma. Viaja en la firma: el informe lo imprime y `/kit-estado` dice que
# está declarado.
LIMITES="- Los commands/, agents/ y skills/ son markdown: nadie comprueba que lo que dicen siga
  siendo cierto. Eso lo hace una persona leyendo el diff.
- Que el plugin CARGUE de verdad en Claude Code solo se ve instalándolo: autocomprueba.sh
  cubre los fallos de manifiesto que ya ocurrieron, no todos los posibles.
- shellcheck corre con --severity=warning, así que sus avisos 'info' quedan fuera a propósito.
- El detector de duplicados lee Swift y aquí no hay ni un .swift: la duplicación en bash de
  este repo no la mira ningún automatismo. Se busca a mano (el pipeline está arriba, en el
  comentario de FUENTES)."

verificaciones() {
    # 1. Que los scripts sean bash válido: un `.sh` con un paréntesis de más se instala igual
    #    y falla en el turno de alguien, no aquí.
    paso "sintaxis · scripts" bash -c '
        set -e
        for f in scripts/*.sh; do bash -n "$f"; done'

    # 2. shellcheck sobre todos los scripts.
    #
    #    LÍMITE DECLARADO: si shellcheck no está instalado, este paso FALLA en vez de saltarse.
    #    Un paso que se salta cuando falta la herramienta firma un verde que no ha comprobado
    #    nada. Si falta: `brew install shellcheck`.
    #
    #    `--severity=warning` deja fuera los `info`: los que salen son un falso positivo
    #    (`paso()` «nunca se invoca» — la invoca kit.conf) y algo deliberado (`$FUENTES` sin
    #    comillar: son varios directorios). Un linter que grita lo que no se va a arreglar deja
    #    de leerse.
    paso "shellcheck · scripts" bash -c '
        command -v shellcheck >/dev/null || {
            echo "falta shellcheck — brew install shellcheck"; exit 1; }
        shellcheck --severity=warning scripts/*.sh'

    # 3. Que el python parsee. Mismo argumento que el 1.
    paso "sintaxis · python" bash -c '
        set -e
        for f in scripts/*.py; do python3 -m py_compile "$f"; done'

    # 4. Los manifiestos y las piezas del plugin: sus fallos se ven al instalar, cuando
    #    `claude plugin list` dice "failed to load".
    paso "manifiestos y piezas del plugin" bash scripts/autocomprueba.sh

    # 5-10. Los bancos de las piezas. Cada uno imprime cuántos casos cubre; el número no se
    #       escribe aquí porque a mano caduca.
    paso "puerta de commit"            bash scripts/verifica-puerta.sh
    paso "contexto inyectado"          bash scripts/verifica-contexto.sh
    paso "lógica repetida · detector"  bash scripts/verifica-duplicados.sh
    paso "rodaja y lo entregado"       bash scripts/verifica-rodaja.sh
    paso "verifica y su firma"         bash scripts/verifica-salidas.sh
    paso "documentación de paquetes"   bash scripts/verifica-doc-paquetes.sh

    # 11. `$VAR` pegado a un carácter no-ASCII. Con `LANG=en_US.UTF-8` —el de Terminal.app—,
    #     `bash` 3.2 mete ese carácter dentro del nombre de la variable y con `set -u` aborta.
    #     Se escribe `${VAR}`. Ni `bash -n` ni `shellcheck` lo ven.
    #
    #     Mira bytes (`-C0`, aunque el entorno traiga `PERL_UNICODE`), y el `END` es lo que pone
    #     el paso en rojo. No ve el código del proyecto, un script fuera de `scripts/`, una
    #     variable partida con `\` al final de línea, ni un fichero que no pueda abrir.
    paso "variables pegadas" perl -C0 -ne 'if (/\$[A-Za-z_][A-Za-z0-9_]*[\x80-\xff]/) { print "$ARGV:$.\n"; $n++ } close ARGV if eof; END { $? = $n ? 1 : 0 }' scripts/*.sh scripts/*.py kit.conf plantillas/kit.conf.ejemplo

}
