# kit.conf — el ÚNICO fichero que el kit necesita del proyecto.
#
# Este proyecto ES el kit. Aquí no hay Swift ni `swift build`: hay bash, markdown y un python,
# así que "verificado" significa otra cosa que en una app iOS y conviene decir exactamente qué.
#
# Existe además porque sin él la puerta de commit del propio kit deja el repo en un callejón sin
# salida: bloquea el commit porque no hay firma, y `verifica.sh` no puede crearla porque aborta
# por falta de `kit.conf`.

# Dónde buscaría duplicados `busca-duplicados.py`.
#
# LÍMITE DECLARADO: ese detector lee Swift, y aquí no hay ni un fichero .swift. Va a reportar
# siempre "0 ficheros", así que la duplicación en bash de este repo no la mira ningún
# automatismo. Se busca a mano, con este pipeline:
#
#   for f in scripts/*.sh; do
#       grep -v '^[[:space:]]*#' "$f" | sed 's/^[[:space:]]*//' | awk 'length>45' | sort -u
#   done | sort | uniq -d
#
# Y por eso NO se escribe un detector de duplicados para bash: encontraría lo que encuentra ese
# pipeline de tres líneas, y costaría un script, su banco y su mantenimiento para siempre. La
# regla de la casa dice que un detector solo nace cuando su clase ya falló dos veces Y no hay
# forma más barata de verlo; aquí la hay.
FUENTES="scripts"

verificaciones() {
    # 1. Que los scripts sean bash válido. Es lo mínimo y es instantáneo: un `.sh` con un
    #    paréntesis de más se instala igual y falla en el turno de alguien, no aquí.
    paso "sintaxis · scripts" bash -c '
        set -e
        for f in scripts/*.sh; do bash -n "$f"; done'

    # 2. shellcheck sobre todos los scripts.
    #
    #    LÍMITE DECLARADO: si shellcheck no está instalado, este paso FALLA en vez de saltarse.
    #    Es deliberado — un paso que se salta cuando falta la herramienta firma un verde que no
    #    ha comprobado nada, y este kit existe en buena parte para que eso no pase. Si falta:
    #    `brew install shellcheck`.
    #
    #    `--severity=warning` deja fuera los `info`, y es una decisión, no pereza: de los que
    #    salen hoy, uno es un falso positivo (`paso()` «nunca se invoca» — la invoca kit.conf) y
    #    otro señala algo deliberado (`$FUENTES` sin comillar: son varios directorios). Un
    #    linter que grita lo que no se va a arreglar deja de leerse.
    paso "shellcheck · scripts" bash -c '
        command -v shellcheck >/dev/null || {
            echo "falta shellcheck — brew install shellcheck"; exit 1; }
        shellcheck --severity=warning scripts/*.sh'

    # 3. Que el python parsee. Mismo argumento que el 1.
    paso "sintaxis · python" bash -c '
        set -e
        for f in scripts/*.py; do python3 -m py_compile "$f"; done'

    # 4. Los manifiestos y las piezas del plugin. Sus fallos no se ven leyendo el fichero: se
    #    ven al instalar, cuando `claude plugin list` dice "failed to load".
    paso "manifiestos y piezas del plugin" bash scripts/autocomprueba.sh

    # 5-10. Los bancos de las piezas. Cada uno nació fijando un fallo real de la suya, y el
    #       resto de sus casos son de no-regresión. El recuento de casos no se escribe aquí: lo
    #       imprime cada banco, contado, porque escrito a mano ya caducó dos veces.
    paso "puerta de commit"            bash scripts/verifica-puerta.sh
    paso "contexto inyectado"          bash scripts/verifica-contexto.sh
    paso "lógica repetida · detector"  bash scripts/verifica-duplicados.sh
    paso "rodaja y lo entregado"       bash scripts/verifica-rodaja.sh
    paso "verifica y su firma"         bash scripts/verifica-salidas.sh
    paso "documentación de paquetes"   bash scripts/verifica-doc-paquetes.sh

    # 11. `$VAR` pegado a un carácter no-ASCII. Con `LANG=en_US.UTF-8` —el de Terminal.app—,
    #     `bash` 3.2 mete ese carácter dentro del nombre de la variable y con `set -u` aborta.
    #     Se escribe `${VAR}`. Ni `bash -n` ni `shellcheck` lo ven.
    #
    #     Mira bytes (`-C0`, aunque el entorno traiga `PERL_UNICODE`), y el `END` es lo que pone
    #     el paso en rojo: sin él, perl sale con 0. No ve el código del proyecto, un script fuera
    #     de `scripts/` o en una subcarpeta suya, una variable partida con `\` al final de línea,
    #     ni un fichero que no pueda abrir.
    paso "variables pegadas" perl -C0 -ne 'if (/\$[A-Za-z_][A-Za-z0-9_]*[\x80-\xff]/) { print "$ARGV:$.\n"; $n++ } close ARGV if eof; END { $? = $n ? 1 : 0 }' scripts/*.sh scripts/*.py kit.conf plantillas/kit.conf.ejemplo

    # LO QUE NO SE VERIFICA AQUÍ, dicho para que nadie lea de más en la firma:
    #
    # - Los `commands/`, `agents/` y `skills/` son markdown: nadie comprueba que lo que dicen
    #   siga siendo cierto. Eso lo hace una persona leyendo el diff.
    # - Que el plugin CARGUE de verdad en Claude Code solo se ve instalándolo.
    #   `autocomprueba.sh` cubre los fallos de manifiesto que ya ocurrieron, no todos los
    #   posibles.
}
