# kit.conf — el ÚNICO fichero que el kit necesita del proyecto.
#
# Este proyecto ES el kit. Aquí no hay Swift ni `swift build`: hay bash, markdown y un
# python. Así que "verificado" significa otra cosa que en una app iOS, y conviene decir
# exactamente qué.
#
# Por qué existe: sin este fichero, la puerta de commit del propio kit deja el repo en un
# callejón sin salida — bloquea el commit porque no hay firma, y `verifica.sh` no puede
# crearla porque aborta por falta de `kit.conf`. Arreglar ese deadlock para todos los
# repos ajenos es el cambio `la-puerta-mira-el-repo-del-commit`; para ESTE repo, que sí es
# del kit, la salida correcta no es que la puerta lo ignore: es tener kit.conf.

# Dónde buscaría duplicados `busca-duplicados.py`.
#
# LÍMITE DECLARADO: ese detector lee Swift, y aquí no hay ni un fichero .swift. Va a
# reportar siempre "0 ficheros", y eso NO significa que no haya lógica repetida en los
# scripts — significa que nadie la está buscando. La duplicación en bash de este repo se
# revisa a ojo, en /kit-revisa, hasta que exista un detector que la vea.
FUENTES="scripts"

verificaciones() {
    # 1. Que los scripts sean bash válido. Es lo mínimo y es instantáneo: un `.sh` con un
    #    paréntesis de más se instala igual y falla en el turno de alguien, no aquí.
    paso "sintaxis · scripts" bash -c '
        set -e
        for f in scripts/*.sh; do bash -n "$f"; done'

    # 2. shellcheck sobre todos los scripts.
    #
    #    LÍMITE DECLARADO: si shellcheck no está instalado, este paso FALLA en vez de
    #    saltarse. Es deliberado. Un paso que se salta solo cuando falta la herramienta
    #    firma un verde que no ha comprobado nada, y este kit existe en buena parte para
    #    que eso no pase. Si falta: `brew install shellcheck`.
    #
    #    `--severity=warning` deja fuera los `info`, y eso es una decisión, no pereza: de
    #    los que salen hoy, uno es un falso positivo (`paso()` «nunca se invoca» — la
    #    invoca kit.conf) y otro señala algo DELIBERADO (`$FUENTES` sin comillar en
    #    verifica.sh: son varios directorios y comillarlo lo rompería). Un linter que grita
    #    lo que no se va a arreglar deja de leerse.
    #
    #    Aquí hubo un `--exclude=SC2038`, deuda con dueño escrito: `inyecta-contexto.sh`
    #    encadenaba `find` con `xargs` sin `-print0` y se comía las rutas con espacios, que
    #    en DerivedData las hay. El cambio `el-contexto-dice-de-que-repo-habla` reescribió
    #    esa parte, así que la exclusión se ha borrado — que es lo que tenía que pasar.
    paso "shellcheck · scripts" bash -c '
        command -v shellcheck >/dev/null || {
            echo "falta shellcheck — brew install shellcheck"; exit 1; }
        shellcheck --severity=warning scripts/*.sh'

    # 3. Que el python parsee. Mismo argumento que el 1.
    paso "sintaxis · python" bash -c '
        set -e
        for f in scripts/*.py; do python3 -m py_compile "$f"; done'

    # 4. Los manifiestos y las piezas del plugin. Existe porque fallaron DOS veces el mismo
    #    día y no se ven leyendo el fichero: se ven al instalar.
    paso "manifiestos y piezas del plugin" bash scripts/autocomprueba.sh

    # 5. El banco de pruebas de la puerta de commit.
    #
    #    Nació en rojo a propósito, fijando los fallos de la puerta, y hoy está en verde.
    #    El resto de sus casos son de no-regresión: pasaban antes y tienen que seguir
    #    pasando. El recuento no se escribe aquí — lo imprime el banco, contado. La primera
    #    versión de este comentario decía «once casos» y el README decía «diez» el mismo
    #    día.
    paso "puerta de commit" bash scripts/verifica-puerta.sh

    # 6. El banco del hook que inyecta el contexto.
    #
    #    Mismo patrón que el 5. Entre sus casos de no-regresión hay uno que importa más de
    #    lo que parece: que el caché no sirva las dependencias de un proyecto a otro. Ese
    #    aislamiento ya existía porque el caché vivía dentro de cada repo; al sacarlo fuera
    #    había que no romperlo.
    paso "contexto inyectado" bash scripts/verifica-contexto.sh

    # LO QUE NO SE VERIFICA AQUÍ, dicho para que nadie lea de más en la firma:
    #
    # - Los `commands/`, `agents/` y `skills/` son markdown: nadie comprueba que lo que
    #   dicen siga siendo cierto. Eso lo hace una persona leyendo el diff.
    # - Que el plugin CARGUE de verdad en Claude Code solo se ve instalándolo.
    #   `autocomprueba.sh` cubre los fallos de manifiesto que ya ocurrieron, no todos los
    #   posibles.
}
